apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: freight-api-pdb
  namespace: digital-freight-matching
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: freight-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: freight-sidekiq-pdb
  namespace: digital-freight-matching
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: freight-sidekiq
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: freight-resource-quota
  namespace: digital-freight-matching
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: freight-limit-range
  namespace: digital-freight-matching
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container