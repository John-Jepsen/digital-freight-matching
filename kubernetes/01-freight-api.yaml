apiVersion: apps/v1
kind: Deployment
metadata:
  name: freight-api
  namespace: digital-freight-matching
  labels:
    app: freight-api
    component: backend
    cost-center: "freight-platform"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: freight-api
  template:
    metadata:
      labels:
        app: freight-api
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: freight-api
        image: freight-api:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: RAILS_ENV
          valueFrom:
            configMapKeyRef:
              name: freight-app-config
              key: RAILS_ENV
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: freight-app-secrets
              key: secret-key-base
        - name: DATABASE_URL
          value: "postgresql://freight_user:$(POSTGRES_PASSWORD)@postgres:5432/freight_matching"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: freight-app-secrets
              key: postgres-password
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: freight-api
  namespace: digital-freight-matching
  labels:
    app: freight-api
spec:
  selector:
    app: freight-api
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP