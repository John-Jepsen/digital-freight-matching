apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freight-app-ingress
  namespace: digital-freight-matching
  labels:
    app: freight-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api.freight-matching.example.com
    secretName: freight-api-tls
  rules:
  - host: api.freight-matching.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: freight-api
            port:
              number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: freight-api-loadbalancer
  namespace: digital-freight-matching
  labels:
    app: freight-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: freight-api
  ports:
  - port: 80
    targetPort: 3000
    name: http
  - port: 443
    targetPort: 3000
    name: https