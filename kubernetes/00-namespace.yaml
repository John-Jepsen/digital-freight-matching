apiVersion: v1
kind: Namespace
metadata:
  name: digital-freight-matching
  labels:
    name: digital-freight-matching
    cost-center: "freight-platform"
    environment: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freight-app-config
  namespace: digital-freight-matching
data:
  RAILS_ENV: "production"
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SERVE_STATIC_FILES: "true"
  # Database and service URLs will be set via environment-specific overlays
---
apiVersion: v1
kind: Secret
metadata:
  name: freight-app-secrets
  namespace: digital-freight-matching
type: Opaque
data:
  # These should be base64 encoded values
  # In production, use external secret management (e.g., AWS Secrets Manager, Vault)
  secret-key-base: <base64-encoded-secret-key>
  postgres-password: <base64-encoded-postgres-password>
  redis-password: <base64-encoded-redis-password>