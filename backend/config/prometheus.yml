# Prometheus Configuration for Digital Freight Matching Platform
# This configuration defines scraping targets and alerting rules

global:
  scrape_interval: 15s      # Set the scrape interval to every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'digital-freight-matching'
    environment: 'development'

# Rules and alerts configuration
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Digital Freight Matching Rails Application
  - job_name: 'freight-rails-api'
    static_configs:
      - targets: ['freight_api:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    honor_timestamps: true

  # Background Jobs (Sidekiq)
  - job_name: 'freight-sidekiq'
    static_configs:
      - targets: ['freight_sidekiq:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Database Monitoring (if postgres_exporter is available)
  - job_name: 'freight-postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 30s

  # Redis Monitoring (if redis_exporter is available)
  - job_name: 'freight-redis'
    static_configs:
      - targets: ['redis_exporter:9121']
    scrape_interval: 30s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Application-specific health checks
  - job_name: 'freight-health-checks'
    static_configs:
      - targets: ['freight_api:3000']
    metrics_path: '/api/v1/health'
    scrape_interval: 10s
    scrape_timeout: 5s

# Remote write configuration (for long-term storage)
# Uncomment if using remote storage like Prometheus Cloud or Thanos
# remote_write:
#   - url: "https://your-remote-prometheus-endpoint/api/v1/write"
#     basic_auth:
#       username: "your_username"
#       password: "your_password"
=======
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'rails_app'
    static_configs:
      - targets: ['freight_api:80']