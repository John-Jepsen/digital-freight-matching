# PostgreSQL primary server configuration for streaming replication
# Optimized for high concurrency and read replica support

# Connection settings - optimized for high load
max_connections = 200                    # Support more concurrent connections
shared_buffers = 256MB                   # Increase shared buffer size
effective_cache_size = 1GB              # Assume 1GB available for caching

# Write-ahead logging settings for streaming replication
wal_level = replica                      # Enable replica WAL level
max_wal_senders = 10                    # Support multiple replicas
max_replication_slots = 10              # Replication slots for reliability
wal_keep_segments = 64                  # Keep more WAL segments
archive_mode = on                       # Enable WAL archiving
archive_command = '/bin/true'           # Placeholder archive command

# Streaming replication settings
hot_standby = on                        # Enable hot standby
max_standby_archive_delay = 30s         # Max delay for archive recovery
max_standby_streaming_delay = 30s       # Max delay for streaming

# Performance optimizations
checkpoint_completion_target = 0.7      # Smooth checkpoints
wal_buffers = 16MB                      # Larger WAL buffers
checkpoint_segments = 32                # More checkpoint segments
random_page_cost = 1.1                 # Assume SSD storage

# Logging and monitoring
log_destination = 'stderr'
log_min_duration_statement = 1000       # Log slow queries (> 1 second)
log_connections = on
log_disconnections = on
log_duration = off
log_statement = 'mod'                   # Log modifications

# Autovacuum tuning for high write loads
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# Connection pooling support
listen_addresses = '*'
port = 5432

# Authentication
ssl = off                               # Disable SSL for development