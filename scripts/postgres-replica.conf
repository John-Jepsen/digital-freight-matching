# PostgreSQL replica server configuration
# Optimized for read operations and streaming replication

# Connection settings - higher for read replicas
max_connections = 300                    # More connections for read operations
shared_buffers = 256MB                   # Same as primary
effective_cache_size = 1GB              # Assume 1GB available for caching

# Replica-specific settings
hot_standby = on                        # Enable read queries on replica
max_standby_archive_delay = 300s        # Longer delay for read consistency
max_standby_streaming_delay = 300s      # Longer delay for read consistency
hot_standby_feedback = on               # Send feedback to primary

# Write-ahead logging
wal_level = replica
wal_buffers = 16MB

# Performance optimizations for read workloads
random_page_cost = 1.1                 # Assume SSD storage
seq_page_cost = 1.0                    # Sequential scan cost
cpu_tuple_cost = 0.01                  # CPU cost per tuple
cpu_index_tuple_cost = 0.005           # CPU cost per index tuple
cpu_operator_cost = 0.0025             # CPU cost per operator

# Query optimization for read replicas
work_mem = 64MB                        # More memory for sorts/hashes
maintenance_work_mem = 256MB           # Memory for maintenance operations
effective_io_concurrency = 200         # Concurrent I/O operations

# Logging
log_destination = 'stderr'
log_min_duration_statement = 1000       # Log slow queries
log_connections = on
log_disconnections = on

# Replica recovery settings
standby_mode = on
recovery_target_timeline = 'latest'

# Connection settings
listen_addresses = '*'
port = 5432

# Authentication
ssl = off                               # Disable SSL for development